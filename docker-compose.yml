
services:
  db:
    image: postgres:17
    container_name: taxi-postgres
    environment:
      POSTGRES_USER: mem
      POSTGRES_PASSWORD: mem
      POSTGRES_DB: orders_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mem -d orders_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
  migration:
    image: postgres:17
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: mem
      POSTGRES_PASSWORD: mem
      POSTGRES_DB: orders_db
    volumes:
      - ./taxi/postgresql/migrations:/migrations
    entrypoint: >
      bash -c "
        for f in /migrations/*.sql; do
          PGPASSWORD=$$POSTGRES_PASSWORD psql -h db -U $$POSTGRES_USER -d $$POSTGRES_DB -f $$f;
        done
      "